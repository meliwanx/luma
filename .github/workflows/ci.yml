name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luma_test
          POSTGRES_USER: luma
          POSTGRES_PASSWORD: test-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luma -d luma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: luma
      DB_PASSWORD: test-database-password
      DB_NAME: luma_test
      TEST_DB_NAME: luma_test
      DB_POOL_MAX: "3"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "15"
      LUMA_PROVIDER: local
      AUTH_SESSION_SECRET: test-only-session-secret-at-least-32-characters
      AUTH_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests in one process
        working-directory: backend
        run: python -m unittest discover -s tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build web
        working-directory: apps/web
        run: npm run build
